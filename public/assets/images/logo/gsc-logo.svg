<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 47" width="175" height="47" role="img" aria-label="GSC Containers">
  <defs>
    <style>
      .gsc-text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <!-- Container box icon -->
  <rect x="2" y="10" width="36" height="27" rx="3" ry="3" fill="none" stroke="#1a4f8a" stroke-width="2.5"/>
  <line x1="2" y1="24" x2="38" y2="24" stroke="#1a4f8a" stroke-width="1.5"/>
  <line x1="20" y1="10" x2="20" y2="37" stroke="#1a4f8a" stroke-width="1.5"/>
  <!-- Corner fittings -->
  <rect x="1" y="9" width="6" height="6" rx="1" fill="#1a4f8a"/>
  <rect x="31" y="9" width="6" height="6" rx="1" fill="#1a4f8a"/>
  <rect x="1" y="32" width="6" height="6" rx="1" fill="#1a4f8a"/>
  <rect x="31" y="32" width="6" height="6" rx="1" fill="#1a4f8a"/>
  <!-- Text: GSC -->
  <text x="48" y="31" class="gsc-text" font-size="22" font-weight="700" fill="#1a1916" letter-spacing="-0.5">GSC</text>
  <!-- Subtitle -->
  <text x="48" y="43" class="gsc-text" font-size="9" font-weight="400" fill="#5a5750" letter-spacing="1.5">CONTAINERS</text>
</svg>
